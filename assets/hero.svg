<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Sydney skyline and a website going live</title>
  <desc id="heroDesc">Simple illustration of a Sydney skyline and a website going live</desc>
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10202c"/>
      <stop offset="1" stop-color="#0a121a"/>
    </linearGradient>
    <linearGradient id="harbourWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#113044"/>
      <stop offset="1" stop-color="#0a121a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#nightSky)"/>
  <circle cx="520" cy="70" r="140" fill="#6FD957" opacity="0.10"/>
  <circle cx="86" cy="54" r="4" fill="#6FD957" opacity="0.7"/>
  <circle cx="148" cy="28" r="2.5" fill="#f5f5f5" opacity="0.45"/>
  <circle cx="210" cy="62" r="2" fill="#f5f5f5" opacity="0.35"/>
  <circle cx="300" cy="36" r="2.2" fill="#6FD957" opacity="0.45"/>

  <!-- CBD towers -->
  <g fill="#152433">
    <rect x="42" y="214" width="28" height="150"/>
    <rect x="76" y="188" width="34" height="176"/>
    <rect x="116" y="228" width="22" height="136"/>
    <rect x="168" y="204" width="30" height="160"/>
    <rect x="204" y="176" width="38" height="188"/>
    <rect x="248" y="222" width="24" height="142"/>
  </g>
  <g fill="#6FD957" opacity="0.55">
    <rect x="48" y="228" width="4" height="8"/>
    <rect x="56" y="228" width="4" height="8"/>
    <rect x="48" y="244" width="4" height="8"/>
    <rect x="82" y="202" width="5" height="9"/>
    <rect x="92" y="202" width="5" height="9"/>
    <rect x="82" y="218" width="5" height="9"/>
    <rect x="210" y="190" width="5" height="9"/>
    <rect x="220" y="190" width="5" height="9"/>
    <rect x="230" y="190" width="5" height="9"/>
    <rect x="210" y="206" width="5" height="9"/>
  </g>

  <!-- Harbour Bridge -->
  <g fill="none" stroke="#6FD957" stroke-width="6" stroke-linecap="round">
    <path d="M268 318 C300 214, 400 214, 432 318"/>
  </g>
  <g fill="#42AC27">
    <rect x="292" y="248" width="8" height="78"/>
    <rect x="400" y="248" width="8" height="78"/>
    <rect x="268" y="318" width="164" height="8"/>
  </g>
  <g stroke="#2e2e35" stroke-width="2">
    <path d="M300 256 L300 318"/>
    <path d="M324 236 L324 318"/>
    <path d="M348 228 L348 318"/>
    <path d="M372 236 L372 318"/>
    <path d="M396 256 L396 318"/>
  </g>

  <!-- Opera House sails -->
  <g fill="#e8f6e4" stroke="#6FD957" stroke-width="2">
    <path d="M458 326 C458 270, 498 236, 548 232 C520 262, 508 296, 508 326 Z"/>
    <path d="M430 326 C430 286, 458 258, 500 252 C478 278, 470 304, 470 326 Z"/>
    <path d="M412 326 C412 300, 430 282, 458 278 C446 296, 442 312, 442 326 Z"/>
  </g>
  <path d="M400 326 H560" stroke="#6FD957" stroke-width="3"/>

  <!-- Harbour -->
  <rect x="0" y="326" width="640" height="154" fill="url(#harbourWater)"/>
  <path d="M0 338 C80 328, 160 348, 240 336 C320 324, 400 350, 480 334 C540 324, 600 340, 640 332" fill="none" stroke="#6FD957" stroke-width="2" opacity="0.35"/>
  <path d="M0 358 C90 348, 180 368, 270 356 C360 344, 450 370, 540 354 C590 346, 620 360, 640 354" fill="none" stroke="#42AC27" stroke-width="1.5" opacity="0.25"/>

  <!-- Site going live -->
