    <rect x="368" y="48" width="236" height="168" rx="16" fill="#12161c" stroke="#2e2e35"/>
    <circle cx="390" cy="70" r="5" fill="#ef4444"/>
    <circle cx="408" cy="70" r="5" fill="#f59e0b"/>
    <circle cx="426" cy="70" r="5" fill="#6FD957"/>
    <rect x="448" y="62" width="132" height="16" rx="8" fill="#1a1d22"/>
    <rect x="384" y="92" width="204" height="108" rx="10" fill="#0a121a"/>
    <rect x="396" y="108" width="88" height="10" rx="5" fill="#6FD957"/>
    <rect x="396" y="126" width="120" height="7" rx="3.5" fill="#2e2e35"/>
    <rect x="396" y="140" width="104" height="7" rx="3.5" fill="#2e2e35"/>
    <rect x="396" y="164" width="64" height="20" rx="10" fill="#6FD957"/>
    <rect x="496" y="108" width="76" height="76" rx="10" fill="#152433" stroke="#2e2e35"/>
    <path d="M508 168 h52 v8 h-52 z M516 148 h16 v20 h-16 z M544 140 h16 v28 h-16 z" fill="#42AC27"/>
    <rect x="500" y="36" width="86" height="26" rx="13" fill="#6FD957"/>
    <text x="543" y="54" text-anchor="middle" fill="#0a121a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">LIVE</text>
  </g>
